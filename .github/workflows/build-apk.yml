name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release EstateRadar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Hardware Permissions & Gradle Dependencies
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Hardware & In-App Auto-Update Permissions in AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              perms = '''    <!-- Hardware & In-App Auto-Update Permissions -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
          '''
              if 'REQUEST_INSTALL_PACKAGES' not in content:
                  content = content.replace('<uses-permission android:name="android.permission.INTERNET" />', perms)
                  with open(manifest_path, 'w') as f:
                      f.write(content)

          # 2. FileProvider file_paths.xml
          file_paths = 'android/app/src/main/res/xml/file_paths.xml'
          if os.path.exists(file_paths):
              xml_content = '''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <external-files-path name="external_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          '''
              with open(file_paths, 'w') as f:
                  f.write(xml_content)

          # 3. Native AppUpdaterPlugin.java
          updater_plugin_path = 'android/app/src/main/java/com/estateradar/tracker/AppUpdaterPlugin.java'
          os.makedirs(os.path.dirname(updater_plugin_path), exist_ok=True)
          plugin_java = '''package com.estateradar.tracker;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {

              @PluginMethod
              public void startAutoUpdate(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || url.isEmpty()) {
                      call.reject("Download URL is required");
                      return;
                  }

                  try {
                      Context context = getContext();
                      DownloadManager downloadManager = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
                      Uri downloadUri = Uri.parse(url);

                      File downloadDir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      if (downloadDir != null && !downloadDir.exists()) {
                          downloadDir.mkdirs();
                      }
                      File apkFile = new File(downloadDir, "EstateRadar_latest.apk");
                      if (apkFile.exists()) {
                          apkFile.delete();
                      }

                      DownloadManager.Request request = new DownloadManager.Request(downloadUri);
                      request.setTitle("EstateRadar Auto-Update");
                      request.setDescription("Downloading latest update...");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalFilesDir(context, Environment.DIRECTORY_DOWNLOADS, "EstateRadar_latest.apk");
                      request.setMimeType("application/vnd.android.package-archive");

                      long downloadId = downloadManager.enqueue(request);

                      BroadcastReceiver onComplete = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context c, Intent intent) {
                              long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                              if (id == downloadId) {
                                  try {
                                      context.unregisterReceiver(this);
                                  } catch (Exception ignored) {}

                                  File file = new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "EstateRadar_latest.apk");
                                  if (file.exists()) {
                                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                                      installIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                                      Uri fileUri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", file);
                                      installIntent.setDataAndType(fileUri, "application/vnd.android.package-archive");
                                      context.startActivity(installIntent);
                                  }
                              }
                          }
                      };

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          context.registerReceiver(onComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED);
                      } else {
                          context.registerReceiver(onComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                      }

                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Failed: " + e.getMessage());
                  }
              }
          }
          '''
          with open(updater_plugin_path, 'w') as f:
              f.write(plugin_java)

          # 4. Register plugin in MainActivity.java
          main_activity_path = 'android/app/src/main/java/com/estateradar/tracker/MainActivity.java'
          main_activity_java = '''package com.estateradar.tracker;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          '''
          with open(main_activity_path, 'w') as f:
              f.write(main_activity_java)

          # 5. Exclude duplicate kotlin-stdlib-jdk7/8 in android/app/build.gradle and ensure versionCode 4 & versionName 1.0.4
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  app_content = f.read()

              app_content = re.sub(r'versionCode \d+', 'versionCode 4', app_content)
              app_content = re.sub(r'versionName "[^"]+"', 'versionName "1.0.4"', app_content)

              if 'kotlin-stdlib-jdk' not in app_content:
                  app_fix = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          '''
                  app_content += app_fix
              with open(app_gradle, 'w') as f:
                  f.write(app_content)

          # 6. Apply resolution strategy in root android/build.gradle
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  root_content = f.read()
              if 'kotlin-stdlib-jdk' not in root_content:
                  root_content = root_content.replace('allprojects {', '''allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }''')
                  with open(root_gradle, 'w') as f:
                      f.write(root_content)
          print('Successfully patched AndroidManifest.xml, Native AppUpdater, and Gradle for v1.0.4!')
          EOF

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/EstateRadar.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstateRadar-APK
          path: output/EstateRadar.apk

      - name: Release APK File
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.4
          name: EstateRadar v1.0.4 Android App
          body: |
            ### 📱 EstateRadar v1.0.4 Android Release
            - **Obsidian Telemetry Design System**: Complete UI overhaul based on Nordic Mobile Utility specifications.
            - **Auth Gateway**: Segmented capsules for Agency Office vs Field Surveyor, biometric passkey trigger, and real-time agency registration.
            - **Agency Manager Cockpit**: Live Leaflet radar telemetry, floating status pills, collapsible technical drawer, and staff join request management.
            - **Verified Cadastral Dossier**: Cryptographic seal, SHA-256 hash attestation, stamped photo with burned-in HUD bar, and anti-slacking proximity audit (4.2m setback, 24m dwell).
            - **Field Surveyor Cockpit**: Shift attendance card with live ticking timer, hardware camera photo stamping, and My Surveys directory.
            - **Zero Dummy Data**: Roster, surveys, and alerts render real state data with authentic empty states.
            - **In-App Auto-Update**: Seamless in-app OTA updates without external redirects.
          files: output/EstateRadar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
