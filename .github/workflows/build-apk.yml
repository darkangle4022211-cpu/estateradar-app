name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release EstateRadar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Hardware Permissions & Gradle Dependencies
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Hardware Permissions in AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              perms = '''    <!-- Hardware Permissions for Field Telemetry & Surveys -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
          '''
              if 'ACCESS_FINE_LOCATION' not in content:
                  content = content.replace('<uses-permission android:name="android.permission.INTERNET" />', perms)
                  with open(manifest_path, 'w') as f:
                      f.write(content)

          # 2. Exclude duplicate kotlin-stdlib-jdk7/8 in android/app/build.gradle and ensure versionCode 3 & versionName 1.0.3
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  app_content = f.read()

              app_content = re.sub(r'versionCode \d+', 'versionCode 3', app_content)
              app_content = re.sub(r'versionName "[^"]+"', 'versionName "1.0.3"', app_content)

              if 'kotlin-stdlib-jdk' not in app_content:
                  app_fix = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          '''
                  app_content += app_fix
              with open(app_gradle, 'w') as f:
                  f.write(app_content)

          # 3. Apply resolution strategy in root android/build.gradle
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  root_content = f.read()
              if 'kotlin-stdlib-jdk' not in root_content:
                  root_content = root_content.replace('allprojects {', '''allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }''')
                  with open(root_gradle, 'w') as f:
                      f.write(root_content)
          print('Successfully patched AndroidManifest.xml and Gradle build configs for v1.0.3!')
          EOF

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/EstateRadar.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstateRadar-APK
          path: output/EstateRadar.apk

      - name: Release APK File
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.3
          name: EstateRadar v1.0.3 Android App
          body: |
            ### 📱 EstateRadar v1.0.3 Android Release
            - Online In-App OTA Update Support (directly updatable within the app)
            - Dedicated Agency Manager Registration & Workspace Activation
            - Edge-to-Edge Android 15 & Material 3 Compliant UI
            - Multi-Tenant Isolated Cloud Architecture
            - Hardware Camera GPS Watermarking and Zero Dummy Data
          files: output/EstateRadar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
